name: Terraform Prod

on:
  pull_request:
    branches: [main]
    paths:
      - "envs/prod/**"
      - "modules/**"
      - ".github/workflows/terraform-prod.yml"
  push:
    branches: [main]
    paths:
      - "envs/prod/**"
      - "modules/**"
      - ".github/workflows/terraform-prod.yml"

permissions:
  id-token: write       # OIDC login to AWS
  contents: read
  pull-requests: write  # post plan as PR comment

concurrency:
  group: terraform-prod
  cancel-in-progress: false

defaults:
  run:
    working-directory: envs/prod

env:
  AWS_REGION: ap-southeast-2
  TF_VERSION: 1.16.6

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format check
        run: terraform fmt -check -recursive ../..

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate -no-color

      - name: Plan
        id: plan
        run: terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const plan = process.env.PLAN.slice(-60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Terraform Plan — prod\n\`\`\`hcl\n${plan}\n\`\`\``
            });

      - name: Upload plan
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-prod
          path: envs/prod/tfplan
          retention-days: 1

  apply:
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production   # manual approval gate (set in GitHub settings)
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: tfplan-prod
          path: envs/prod

      - name: Init
        run: terraform init -input=false

      - name: Apply
        run: terraform apply -input=false -lock-timeout=5m tfplan
